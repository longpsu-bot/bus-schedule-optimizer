[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "bus-schedule-engine"
version = "0.1.0"
description = "Bus Schedule Engine MVP deterministic, rule-based"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<3",
  "plotly>=5.24,<6",
  "streamlit>=1.57,<2",
]

[project.optional-dependencies]
dev = [
  "jsonschema>=4.23,<5",
  "kaleido==0.2.1",
  "pytest>=8.0,<10",
  "ruff>=0.9,<1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
