name: Python CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Apply bounded OR runtime rebase
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/bounded-ortools-runtime-policy-v1-rebased'
        run: python tools/_apply_bounded_ortools_runtime_rebase.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Tests
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          python -m pytest 2>&1 | tee pytest.log

      - name: Ruff lint
        id: lint
        continue-on-error: true
        run: |
          set -o pipefail
          python -m ruff check . \
            --exclude .artifact \
            --exclude outputs \
            --exclude .venv 2>&1 | tee ruff-lint.log

      - name: Ruff format for Contract V1 code
        id: format
        continue-on-error: true
        run: |
          set -o pipefail
          python -m ruff format --check \
            src/bus_schedule_engine/contracts_v1 \
            tests/test_contract*.py 2>&1 | tee ruff-format.log

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-ci-logs
          path: |
            pytest.log
            ruff-lint.log
            ruff-format.log

      - name: Enforce validation result
        if: >-
          steps.tests.outcome == 'failure' ||
          steps.lint.outcome == 'failure' ||
          steps.format.outcome == 'failure'
        run: exit 1

      - name: Commit clean rebased runtime policy
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/bounded-ortools-runtime-policy-v1-rebased'
        run: |
          git show origin/main:.github/workflows/python-ci.yml > .github/workflows/python-ci.yml
          rm tools/_apply_bounded_ortools_runtime_rebase.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Rebase bounded OR-Tools runtime policy onto balanced-regime main"
          git push origin HEAD:fix/bounded-ortools-runtime-policy-v1-rebased
