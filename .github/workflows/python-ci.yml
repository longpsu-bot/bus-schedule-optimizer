name: Apply and validate PR 8 hardening

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/solver-interface-heuristic-adapter-v1
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Apply hardening script
        run: python scripts/pr8_harden.py

      - name: Ruff fix and format
        run: |
          python -m ruff check --fix \
            src/bus_schedule_engine/contracts_v1/solver_fingerprints.py \
            src/bus_schedule_engine/contracts_v1/heuristic_solver.py \
            src/bus_schedule_engine/contracts_v1/solver_validation.py \
            src/bus_schedule_engine/contracts_v1/solver_orchestration.py \
            tests/test_contract_v1_solver.py
          python -m ruff format \
            src/bus_schedule_engine/contracts_v1/solver_fingerprints.py \
            src/bus_schedule_engine/contracts_v1/heuristic_solver.py \
            src/bus_schedule_engine/contracts_v1/solver_validation.py \
            src/bus_schedule_engine/contracts_v1/solver_orchestration.py \
            tests/test_contract_v1_solver.py

      - name: Validate
        run: |
          python -m pytest
          python -m ruff check . --exclude .artifact --exclude outputs --exclude .venv
          python -m ruff format --check \
            src/bus_schedule_engine/contracts_v1 \
            tests/test_contract*.py

      - name: Commit clean result
        run: |
          rm -f scripts/pr8_harden.py
          rm -f .github/workflows/pr8-harden.yml
          rm -f .pr8-harden-trigger
          git fetch origin main
          git show origin/main:.github/workflows/python-ci.yml > .github/workflows/python-ci.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/bus_schedule_engine/contracts_v1 \
            tests/test_contract_v1_solver.py \
            scripts/pr8_harden.py \
            .github/workflows/pr8-harden.yml \
            .github/workflows/python-ci.yml \
            .pr8-harden-trigger
          git commit -m 'Harden solver fingerprints and outcome semantics'
          git push origin HEAD:feat/solver-interface-heuristic-adapter-v1
