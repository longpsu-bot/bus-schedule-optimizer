name: Export current engine source

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Package current PR source
        run: git archive --format=tar.gz --output=current-engine-source.tar.gz HEAD

      - name: Build self-contained pilot runtime
        run: |
          python -m pip install . -t pilot_runtime
          tar -czf pilot-runtime.tar.gz pilot_runtime

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: current-engine-source
          path: current-engine-source.tar.gz

      - name: Upload pilot runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: pilot-runtime
          path: pilot-runtime.tar.gz
