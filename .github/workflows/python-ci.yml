name: Python CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Prepare Ruff-formatted PR files
        run: |
          targets=(
            src/bus_schedule_engine/contracts_v1/heuristic_solver.py
            src/bus_schedule_engine/contracts_v1/solver_orchestration.py
            src/bus_schedule_engine/contracts_v1/solver_problem.py
            src/bus_schedule_engine/contracts_v1/solver_serialization.py
            src/bus_schedule_engine/contracts_v1/solver_validation.py
            tests/test_contract_v1_solver.py
          )
          python -m ruff check --fix "${targets[@]}"
          python -m ruff format "${targets[@]}"
          mkdir -p ruff-formatted
          cp --parents "${targets[@]}" ruff-formatted/

      - name: Upload Ruff-formatted PR files
        uses: actions/upload-artifact@v4
        with:
          name: pr8-ruff-formatted-files
          path: ruff-formatted

      - name: Tests
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          python -m pytest 2>&1 | tee pytest.log

      - name: Ruff lint
        id: lint
        continue-on-error: true
        run: |
          set -o pipefail
          python -m ruff check . \
            --exclude .artifact \
            --exclude outputs \
            --exclude .venv 2>&1 | tee ruff-lint.log

      - name: Ruff format for Contract V1 code
        id: format
        continue-on-error: true
        run: |
          set -o pipefail
          python -m ruff format --check \
            src/bus_schedule_engine/contracts_v1 \
            tests/test_contract*.py 2>&1 | tee ruff-format.log

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-ci-logs
          path: |
            pytest.log
            ruff-lint.log
            ruff-format.log

      - name: Enforce validation result
        if: >-
          steps.tests.outcome == 'failure' ||
          steps.lint.outcome == 'failure' ||
          steps.format.outcome == 'failure'
        run: exit 1
