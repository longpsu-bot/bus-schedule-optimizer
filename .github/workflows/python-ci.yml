name: Export current engine source

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Package current PR source
        run: |
          tar --exclude=.git --exclude='*.pyc' --exclude='__pycache__' -czf current-engine-source.tar.gz .

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: current-engine-source
          path: current-engine-source.tar.gz
