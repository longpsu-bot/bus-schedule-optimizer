name: Python CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Tests
        run: python -m pytest

      - name: Ruff lint
        run: python -m ruff check . --exclude .artifact --exclude outputs --exclude .venv

      - name: Ruff format for Contract V1 code
        run: |
          python -m ruff format --check \
            src/bus_schedule_engine/contracts_v1 \
            tests/test_contract_schemas.py \
            tests/test_contract_v1_normalization.py
