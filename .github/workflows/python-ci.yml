name: Python CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Render V1-A1 amended documents
        run: python scripts/apply_v1_a1_docs.py

      - name: Upload V1-A1 amended documents
        uses: actions/upload-artifact@v4
        with:
          name: v1-a1-amended-documents
          path: docs/engine

      - name: Tests
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          python -m pytest 2>&1 | tee pytest.log

      - name: Ruff lint
        id: lint
        continue-on-error: true
        run: |
          set -o pipefail
          python -m ruff check . \
            --exclude .artifact \
            --exclude outputs \
            --exclude .venv 2>&1 | tee ruff-lint.log

      - name: Ruff format for Contract V1 code
        id: format
        continue-on-error: true
        run: |
          set -o pipefail
          python -m ruff format --check \
            src/bus_schedule_engine/contracts_v1 \
            tests/test_contract*.py 2>&1 | tee ruff-format.log

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-ci-logs
          path: |
            pytest.log
            ruff-lint.log
            ruff-format.log

      - name: Enforce validation result
        if: >-
          steps.tests.outcome == 'failure' ||
          steps.lint.outcome == 'failure' ||
          steps.format.outcome == 'failure'
        run: exit 1
