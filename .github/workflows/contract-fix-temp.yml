name: Apply final Contract V1 status fixes (temporary)

on:
  push:
    branches:
      - docs/bus-schedule-engine-contract-v1-pr

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: docs/bus-schedule-engine-contract-v1-pr
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Apply normative status mappings and tests
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Expected text not found in {path}: {old[:80]!r}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "docs/engine/ENGINE_CONTRACT_V1.md",
              """- `SOLUTION_ACCEPTED`;
          - `NO_FEASIBLE_C_WITH_B_PARAMETERS`;
          - `C_NOT_GENERATED_INSUFFICIENT_DATA`;""",
              """- `SOLUTION_ACCEPTED`;
          - `NO_FEASIBLE_C_WITH_B_PARAMETERS`;
          - `C_NOT_FOUND_WITHIN_SOLVE_LIMIT`;
          - `C_NOT_GENERATED_MODEL_INVALID`;
          - `C_NOT_GENERATED_INSUFFICIENT_DATA`;""",
          )

          replace_once(
              "docs/engine/ENGINE_CONTRACT_V1.md",
              """Native solver statuses are `OPTIMAL`, `FEASIBLE`, `INFEASIBLE`, `MODEL_INVALID`, and `UNKNOWN`. User-facing output MUST NOT label `FEASIBLE` as proven optimal. Only native `OPTIMAL` or `FEASIBLE` candidates that pass independent validation may produce `ScheduleSolutionV1`. `UNKNOWN` does not prove infeasibility.""",
              """Native solver statuses are `OPTIMAL`, `FEASIBLE`, `INFEASIBLE`, `MODEL_INVALID`, and `UNKNOWN`. User-facing output MUST NOT label `FEASIBLE` as proven optimal. Only native `OPTIMAL` or `FEASIBLE` candidates that pass independent validation may produce `ScheduleSolutionV1`.

          `INFEASIBLE` maps to `NO_FEASIBLE_C_WITH_B_PARAMETERS` only when the encoded locked problem is the reviewed problem identified by the returned fingerprint. `UNKNOWN` maps to `C_NOT_FOUND_WITHIN_SOLVE_LIMIT` and does not prove infeasibility. `MODEL_INVALID` maps to `C_NOT_GENERATED_MODEL_INVALID` and is an implementation/configuration defect, not a business conclusion.""",
          )

          replace_once(
              "docs/engine/OR_TOOLS_CP_SAT_TARGET_DESIGN_V1.md",
              """Only a native `OPTIMAL` or `FEASIBLE` candidate that passes independent domain validation may populate `ScheduleSolutionV1`. `INFEASIBLE` produces no solution. `UNKNOWN` does not prove infeasibility. A candidate rejected by the domain validator remains non-authoritative and may appear only as diagnostic metadata in the outcome envelope.""",
              """Only a native `OPTIMAL` or `FEASIBLE` candidate that passes independent domain validation may populate `ScheduleSolutionV1`. Native `INFEASIBLE` maps to `NO_FEASIBLE_C_WITH_B_PARAMETERS` only for the reviewed encoded problem. Native `UNKNOWN` maps to `C_NOT_FOUND_WITHIN_SOLVE_LIMIT` and does not prove infeasibility. Native `MODEL_INVALID` maps to `C_NOT_GENERATED_MODEL_INVALID` and indicates a model/configuration defect. A candidate rejected by the domain validator remains non-authoritative and may appear only as diagnostic metadata in the outcome envelope.""",
          )

          replace_once(
              "docs/engine/INPUT_OUTPUT_CONTRACTS_V1.md",
              """`NOT_RUN` is not a CP-SAT status. When B is already suitable or demand is insufficient, the solver fields are null, duration is zero, and `solution` is null. A no-feasible or rejected outcome also has no authoritative Scenario C.""",
              """`NOT_RUN` is not a CP-SAT status. When B is already suitable or demand is insufficient, the solver fields are null, duration is zero, and `solution` is null. A no-feasible or rejected outcome also has no authoritative Scenario C.

          Native `UNKNOWN` maps only to `C_NOT_FOUND_WITHIN_SOLVE_LIMIT`; it is not proof of infeasibility. Native `MODEL_INVALID` maps only to `C_NOT_GENERATED_MODEL_INVALID`; it is not a route or timetable conclusion.""",
          )

          test_path = Path("tests/test_contract_schemas.py")
          tests = test_path.read_text(encoding="utf-8")
          marker = "def test_unknown_and_model_invalid_have_explicit_non_solution_outcomes"
          if marker not in tests:
              tests += '''


          @pytest.mark.parametrize(
              ("result_status", "solver_status"),
              [
                  ("C_NOT_FOUND_WITHIN_SOLVE_LIMIT", "UNKNOWN"),
                  ("C_NOT_GENERATED_MODEL_INVALID", "MODEL_INVALID"),
              ],
          )
          def test_unknown_and_model_invalid_have_explicit_non_solution_outcomes(
              result_status: str,
              solver_status: str,
          ) -> None:
              outcome = _load(EXAMPLE_DIR / "schedule_generation_outcome.example.json")
              outcome.update(
                  {
                      "result_status": result_status,
                      "execution_status": "COMPLETED",
                      "solver_status": solver_status,
                      "solver_adapter": "ortools_cp_sat_target_example",
                      "solve_duration_seconds": 2.0,
                      "solution": None,
                      "diagnostic_candidate": None,
                  }
              )
              assert _schema_errors(outcome, "schedule_generation_outcome.schema.json") == []

              wrong_status = deepcopy(outcome)
              wrong_status["result_status"] = "NO_FEASIBLE_C_WITH_B_PARAMETERS"
              assert _schema_errors(
                  wrong_status,
                  "schedule_generation_outcome.schema.json",
              )
          '''
              test_path.write_text(tests, encoding="utf-8")

      - name: Format changed Python
        run: python -m ruff format tests/test_contract_schemas.py

      - name: Tests
        run: python -m pytest

      - name: Ruff lint
        run: python -m ruff check . --exclude .artifact --exclude outputs --exclude .venv

      - name: Commit and push fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/engine/ENGINE_CONTRACT_V1.md \
                  docs/engine/OR_TOOLS_CP_SAT_TARGET_DESIGN_V1.md \
                  docs/engine/INPUT_OUTPUT_CONTRACTS_V1.md \
                  tests/test_contract_schemas.py
          git commit -m "Complete Contract V1 outcome status mapping"
          git push origin HEAD:docs/bus-schedule-engine-contract-v1-pr
