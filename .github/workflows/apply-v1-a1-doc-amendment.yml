name: Apply V1-A1 documentation amendment

on:
  push:
    branches:
      - docs/extreme-service-change-demand-scenarios-v1
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  amend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/extreme-service-change-demand-scenarios-v1
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Amend Contract V1 documents
        run: |
          python - <<'PY'
          from pathlib import Path

          ROOT = Path('docs/engine')

          def read(name: str) -> str:
              return (ROOT / name).read_text(encoding='utf-8')

          def write(name: str, text: str) -> None:
              (ROOT / name).write_text(text.rstrip() + '\n', encoding='utf-8')

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if new in text:
                  return text
              if old not in text:
                  raise SystemExit(f'Anchor not found for {label}')
              return text.replace(old, new, 1)

          def append_once(text: str, marker: str, addition: str) -> str:
              if marker in text:
                  return text
              return text.rstrip() + '\n\n' + addition.strip() + '\n'

          name = 'ENGINE_CONTRACT_V1.md'
          text = read(name)
          text = replace_once(
              text,
              '**Normative source of truth:** this file, together with the incorporated [Schedule Generation Outcome Contract V1](RESULT_ENVELOPE_CONTRACT_V1.md)',
              '**Normative source of truth:** this file, together with the incorporated [Schedule Generation Outcome Contract V1](RESULT_ENVELOPE_CONTRACT_V1.md) and [Extreme Service Change and Demand Scenario Amendment V1](EXTREME_SERVICE_CHANGE_AND_DEMAND_SCENARIO_AMENDMENT_V1.md)',
              'engine normative source',
          )
          insertion = '''### 2.6 Structural service-change demand boundary

Contract V1 incorporates [Amendment V1-A1](EXTREME_SERVICE_CHANGE_AND_DEMAND_SCENARIO_AMENDMENT_V1.md). `total_daily_trips` is the total across both directions. Directional totals and headways are derived from exact directional departures; an even split is explanatory only and MUST NOT replace actual counts.

When B changes service beyond the temporal or behavioral support of demand observed under A, the engine MUST classify the service change, expose demand temporal/frequency/response support, and separate deterministic technical feasibility from unresolved ridership response. Coarse demand may support aggregate interval capacity analysis but MUST NOT be fabricated into proposed departure-level observations.

For `structural_change` without an approved calibrated response model, `scenario_analysis_required = true`. Demand results are sensitivity scenarios with explicit assumptions, not an authoritative binary suitability conclusion or a forecast. The base user workflow requires A/B exact timetables and operating parameters; passenger evidence is loaded from existing engine context rather than re-entered by the user.

The target additive fields and statuses require a reviewed `1.1.0` schema/domain implementation before runtime use.

'''
          anchor = '## 3. Operating parameter locks for C\n'
          if '### 2.6 Structural service-change demand boundary' not in text:
              if anchor not in text:
                  raise SystemExit('Engine section 3 anchor not found')
              text = text.replace(anchor, insertion + anchor, 1)
          text = replace_once(
              text,
              '- `B_TECHNICALLY_FEASIBLE_BUT_DEMAND_UNSUITABLE`;\n- `B_TECHNICALLY_INFEASIBLE_BUT_PARAMETERS_MAY_ALLOW_REDISTRIBUTION`;',
              '- `B_TECHNICALLY_FEASIBLE_BUT_DEMAND_UNSUITABLE`;\n- `B_TECHNICALLY_FEASIBLE_DEMAND_RESPONSE_UNRESOLVED` (V1-A1 target);\n- `B_TECHNICALLY_INFEASIBLE_BUT_PARAMETERS_MAY_ALLOW_REDISTRIBUTION`;',
              'engine disposition list',
          )
          text = replace_once(
              text,
              'C generation MAY proceed for a technically feasible but demand-unsuitable B, or for a technically infeasible B whose locked parameters may admit another distribution. If the fixed B parameters are infeasible, return a generation outcome with `NO_FEASIBLE_C_WITH_B_PARAMETERS`; do not fabricate C. `B_INSUFFICIENT_DATA` MUST return `C_NOT_GENERATED_INSUFFICIENT_DATA` and MUST NOT produce a demand-optimized C. If B is already suitable, return `C_NOT_REQUIRED_B_SUITABLE` rather than duplicating B as C.',
              'C generation MAY proceed for a technically feasible but demand-unsuitable B, or for a technically infeasible B whose locked parameters may admit another distribution. If the fixed B parameters are infeasible, return a generation outcome with `NO_FEASIBLE_C_WITH_B_PARAMETERS`; do not fabricate C. `B_INSUFFICIENT_DATA` MUST return `C_NOT_GENERATED_INSUFFICIENT_DATA` and MUST NOT produce a demand-optimized C. If B is already suitable, return `C_NOT_REQUIRED_B_SUITABLE` rather than duplicating B as C. Under V1-A1, a technically feasible structural-change case without calibrated demand response returns `B_TECHNICALLY_FEASIBLE_DEMAND_RESPONSE_UNRESOLVED`; the target generation result is `C_NOT_GENERATED_DEMAND_RESPONSE_UNRESOLVED` until an approved scenario or calibrated model is recorded.',
              'engine generation gating',
          )
          text = replace_once(
              text,
              '- [Demand resolution](DEMAND_RESOLUTION_CONTRACT_V1.md)',
              '- [Demand resolution](DEMAND_RESOLUTION_CONTRACT_V1.md)\n- [Extreme service change and demand scenarios](EXTREME_SERVICE_CHANGE_AND_DEMAND_SCENARIO_AMENDMENT_V1.md)',
              'engine supporting docs',
          )
          write(name, text)

          name = 'DEMAND_RESOLUTION_CONTRACT_V1.md'
          text = read(name)
          text = replace_once(
              text,
              'The normative source is [Engine Contract V1 §§2.4–2.5 and §7](ENGINE_CONTRACT_V1.md). This document describes the planned block-building workflow without redefining those rules.',
              'The normative sources are [Engine Contract V1 §§2.4–2.6 and §7](ENGINE_CONTRACT_V1.md) and [Amendment V1-A1](EXTREME_SERVICE_CHANGE_AND_DEMAND_SCENARIO_AMENDMENT_V1.md). This document describes the planned block-building workflow without redefining those rules.',
              'demand normative source',
          )
          text = append_once(text, '## Structural service-change support', '''## Structural service-change support

Demand resolution and proposed service resolution are separate. The engine derives `departures_per_source_demand_interval_A/B`, directional headways, total/directional service-change factors, and local interval changes from exact A/B timetables.

A source interval that contains several B departures supports aggregate interval demand and capacity only. It does not support observed passenger counts for each proposed departure. `demand_temporal_support` is `full`, `partial`, `coarse`, or `unsupported`; `frequency_change_support` is `within_observed_range`, `extrapolation`, or `structural_change`.

When the proposal is structural and no calibrated model exists, `demand_response_support = scenario_analysis_required`. Native/adaptive/manual block construction remains at source-supported grain. Scenario demand assumptions are evaluated over those same authoritative blocks and are labeled assumptions, never observations.

Acceptance checks additionally require:

- total trips are reconciled to actual directional counts before headway analysis;
- no global percentage threshold is the sole structural-change rule;
- coarse source demand is not split among finer B departures;
- static A demand is identified as a lower-bound comparison rather than a ridership forecast;
- required V1-A1 diagnostic codes and post-implementation monitoring limitations propagate to evaluation and presentation.''')
          write(name, text)

          name = 'INPUT_OUTPUT_CONTRACTS_V1.md'
          text = read(name)
          text = replace_once(
              text,
              'The normative rules are [Engine Contract V1 §§2–5 and §§11–16](ENGINE_CONTRACT_V1.md), together with the normative [Schedule Generation Outcome Contract V1](RESULT_ENVELOPE_CONTRACT_V1.md). JSON files in `contracts/v1/` are draft validation artifacts; the Markdown contracts remain authoritative until schemas are formally approved.',
              'The normative rules are [Engine Contract V1 §§2–5 and §§11–16](ENGINE_CONTRACT_V1.md), together with the normative [Schedule Generation Outcome Contract V1](RESULT_ENVELOPE_CONTRACT_V1.md) and [Amendment V1-A1](EXTREME_SERVICE_CHANGE_AND_DEMAND_SCENARIO_AMENDMENT_V1.md). JSON files in `contracts/v1/` are draft validation artifacts; the Markdown contracts remain authoritative until schemas are formally approved.',
              'io normative source',
          )
          text = append_once(text, '## V1-A1 target additions', '''## V1-A1 target additions

The `1.1.0` target adds solver-neutral service-change and scenario-analysis contracts. Required derived fields include total/directional service-change factors, directional A/B headways, headway-compression factors, departures per source-demand interval, service-change classification, and demand temporal/frequency/response support.

The base user input remains exact A/B timetables plus operating parameters. Totals, directional counts, first/last departures, headways, change metrics, and fleet requirements are derived. Observed passenger data is imported or linked evidence context; the structural-change UI does not require users to re-enter passenger rows.

The target output catalogue adds:

- `B_TECHNICALLY_FEASIBLE_DEMAND_RESPONSE_UNRESOLVED`;
- `C_NOT_GENERATED_DEMAND_RESPONSE_UNRESOLVED`;
- scenario catalogue/selection, assumptions, provenance, confidence, and monitoring plan;
- per-scenario interval demand, capacity, load-factor, shortage, and comparison rows.

These additions are documentation-approved migration targets only until `1.1.0` schemas, examples, typed models, validators, serialization, and compatibility tests are merged. Strict `1.0.0` consumers MUST NOT receive undeclared fields or enum values.''')
          write(name, text)

          name = 'DOMAIN_MODEL_V1.md'
          text = read(name)
          text = replace_once(
              text,
              'This document organizes the model defined normatively in [Engine Contract V1](ENGINE_CONTRACT_V1.md) and the [Schedule Generation Outcome Contract V1](RESULT_ENVELOPE_CONTRACT_V1.md). If a field or rule here appears ambiguous, the normative contracts prevail.',
              'This document organizes the model defined normatively in [Engine Contract V1](ENGINE_CONTRACT_V1.md), the [Schedule Generation Outcome Contract V1](RESULT_ENVELOPE_CONTRACT_V1.md), and [Amendment V1-A1](EXTREME_SERVICE_CHANGE_AND_DEMAND_SCENARIO_AMENDMENT_V1.md). If a field or rule here appears ambiguous, the normative contracts prevail.',
              'domain normative source',
          )
          text = append_once(text, '## V1-A1 structural-change domain additions', '''## V1-A1 structural-change domain additions

The `1.1.0` target introduces:

| Model | Purpose |
|---|---|
| `ServiceChangeAssessment` | derived total/directional/local change metrics and `routine_adjustment`/`material_change`/`structural_change` classification |
| `DemandSupportAssessment` | temporal, frequency-change, and demand-response support with diagnostics and provenance |
| `DemandScenarioDefinition` | configured sensitivity method, parameters, approval source, scope, confidence, and limitations |
| `DemandScenarioSelection` | recorded user analysis decision; never an observed fact |
| `DemandScenarioEvaluation` | scenario demand and supply results at authoritative source-demand grain |
| `PostImplementationMonitoringPlan` | review dates, required observations, thresholds, and service-retention/adjustment criteria |

New domain services are `ServiceChangeClassifier`, `DemandSupportEvaluator`, `DemandScenarioEvaluator`, and `MonitoringPlanFactory`. Presentation owns scenario selection interaction but MUST NOT calculate classifications, scenario demand, or load factors.

`total_daily_trips` remains the two-direction total. Directional counts and headways are derived from exact directional timetables and remain independent authoritative values. A symmetric half split is never a domain inference.

A structural-change aggregate may be technically feasible while its demand response is unresolved. This state blocks an authoritative demand-optimized C until an approved scenario selection or calibrated model is present.''')
          write(name, text)

          name = 'SCENARIO_EVALUATION_CONTRACT_V1.md'
          text = read(name)
          text = replace_once(
              text,
              'The normative rules are [Engine Contract V1 §§5–6 and §11](ENGINE_CONTRACT_V1.md). This document defines evaluation sequencing and evidence expectations.',
              'The normative rules are [Engine Contract V1 §§2.6, 5–6 and §11](ENGINE_CONTRACT_V1.md) together with [Amendment V1-A1](EXTREME_SERVICE_CHANGE_AND_DEMAND_SCENARIO_AMENDMENT_V1.md). This document defines evaluation sequencing and evidence expectations.',
              'evaluation normative source',
          )
          text = replace_once(
              text,
              '| valid/consistent | feasible | unsuitable | `B_TECHNICALLY_FEASIBLE_BUT_DEMAND_UNSUITABLE` | may generate C |\n| valid/consistent | infeasible timetable | any known result |',
              '| valid/consistent | feasible | unsuitable | `B_TECHNICALLY_FEASIBLE_BUT_DEMAND_UNSUITABLE` | may generate C |\n| valid/consistent structural change | feasible | response unresolved | `B_TECHNICALLY_FEASIBLE_DEMAND_RESPONSE_UNRESOLVED` | scenario workflow; no authoritative demand-optimized C |\n| valid/consistent | infeasible timetable | any known result |',
              'evaluation decision table',
          )
          text = append_once(text, '## Structural-change evaluation', '''## Structural-change evaluation

Before binary demand suitability, the evaluator derives service-change metrics and demand support. A configured percentage may trigger review but cannot alone determine classification. Total, directional, local-interval, headway-compression, operating-span, and source-grain relationships are evaluated together.

For `structural_change` without calibrated demand response:

- technical, fleet, parameter, and timetable-quality dimensions remain deterministic;
- demand suitability is `NOT_EVALUATED` or the dedicated unresolved target state, not `PASS`/`FAIL`;
- the top-level target disposition is `B_TECHNICALLY_FEASIBLE_DEMAND_RESPONSE_UNRESOLVED` when technical feasibility passes;
- scenario evaluations disclose assumptions and remain sensitivity analysis;
- the target generation action is `C_NOT_GENERATED_DEMAND_RESPONSE_UNRESOLVED` until an approved scenario or calibrated model exists;
- explanations require post-implementation validation and include all triggering metrics/diagnostics.''')
          write(name, text)

          name = 'VISUALIZATION_CONTRACT_V1.md'
          text = read(name)
          text = replace_once(
              text,
              'The authoritative visual rules are [Engine Contract V1 §§13–14](ENGINE_CONTRACT_V1.md). Visuals consume `DemandAnalysisBlock`, `BlockSupplyPlan`, exact timetable, evaluation, and fingerprints; they do not recalculate them.',
              'The authoritative visual rules are [Engine Contract V1 §§13–14](ENGINE_CONTRACT_V1.md) and [Amendment V1-A1](EXTREME_SERVICE_CHANGE_AND_DEMAND_SCENARIO_AMENDMENT_V1.md). Visuals consume authoritative domain outputs and fingerprints; they do not recalculate them.',
              'visual normative source',
          )
          text = append_once(text, '## Structural-change scenario workflow', '''## Structural-change scenario workflow

When `scenario_analysis_required = true`, the UI first presents a technical-change summary rather than a binary demand verdict. It shows A/B total trips, actual directional counts, directional headways, service-change factors, source-demand resolution, departures per source interval, triggering diagnostics, technical/fleet results, and the unresolved-demand status.

The base workflow does not ask users to re-enter demand. It offers configured scenario cards (`static_lower_bound`, `cautious_growth`, `moderate_growth`, `high_growth`, and `custom_approved`) with visible assumptions, provenance, confidence, total demand, passengers per trip, interval LF/shortage ranges, and monitoring requirements.

Observed A demand and scenario demand MUST use different labels and visual treatments. Scenario curves/areas are assumptions, never observations. Demand remains at source-supported interval grain; charts MUST NOT create one passenger point per proposed B departure.

Rendering acceptance additionally requires actual directional counts to reconcile to the two-direction total, per-direction headway display, structural-change trigger explanations, scenario-selection provenance, and an explicit post-implementation validation notice.''')
          write(name, text)

          name = 'XLSX_EXPORT_CONTRACT_V1.md'
          text = read(name)
          text = replace_once(
              text,
              'The normative export rules are [Engine Contract V1 §§14–16](ENGINE_CONTRACT_V1.md) together with the [Schedule Generation Outcome Contract V1](RESULT_ENVELOPE_CONTRACT_V1.md). This is a target design only; Contract V1 does not change the current exporter.',
              'The normative export rules are [Engine Contract V1 §§14–16](ENGINE_CONTRACT_V1.md), the [Schedule Generation Outcome Contract V1](RESULT_ENVELOPE_CONTRACT_V1.md), and [Amendment V1-A1](EXTREME_SERVICE_CHANGE_AND_DEMAND_SCENARIO_AMENDMENT_V1.md). This is a target design only; Contract V1 does not change the current exporter.',
              'xlsx normative source',
          )
          text = replace_once(
              text,
              '| `GIOI_HAN_DU_LIEU` | demand/static-mode/solver limitations | provenance + generation outcome |',
              '| `GIOI_HAN_DU_LIEU` | demand/static-mode/solver limitations | provenance + generation outcome |\n| `KICH_BAN_NHU_CAU` | V1-A1 scenario catalogue, selected assumptions, provenance, and comparative results | service-change assessment + scenario evaluations |\n| `KE_HOACH_HAU_KIEM` | post-implementation evidence and review criteria for structural changes | monitoring plan |',
              'xlsx target sheets',
          )
          text = append_once(text, '## Structural-change export', '''## Structural-change export

For a structural-change case, `TONG_QUAN` and `DANH_GIA_B` show total and actual directional A/B trips, directional headways, service-change classification, support classifications, triggering diagnostics, and `B_TECHNICALLY_FEASIBLE_DEMAND_RESPONSE_UNRESOLVED` where applicable.

`KICH_BAN_NHU_CAU` distinguishes observed A demand from scenario assumptions and compares static/cautious/moderate/high/custom scenarios at authoritative source-demand grain. It records every parameter, unit, approval/provenance source, confidence, limitation, and selected scenario. It MUST NOT allocate assumed demand to individual B departures without supported finer evidence.

`KE_HOACH_HAU_KIEM` records implementation/review dates, trip/direction/time boarding evidence, denied boarding, headway/reliability observations, segmentation, and retain/increase/reduce/redistribute criteria.

Until `1.1.0` output schemas and exporters are implemented, these sheets and statuses are target design and MUST NOT be simulated by placing undeclared fields in a strict `1.0.0` workbook.''')
          write(name, text)

          name = 'MIGRATION_ROADMAP_TO_OR_TOOLS.md'
          text = read(name)
          stage = '''## Stage 3A — Structural-change demand boundary

Implement Amendment V1-A1: schema/domain version `1.1.0`, derived total/directional/local service-change metrics, support classifications, unresolved-demand disposition/result, scenario catalogue/provenance, UI selection workflow, scenario-aware visualization/XLSX, and monitoring contract.

Hard-constraint OR-Tools feasibility work may proceed in parallel. Production-conforming demand allocation for structural-change cases is blocked until Stage 3A exits.

**Exit gate:** extreme/coarse-resolution fixtures prove no fabricated departure-level demand; scenario assumptions are fully traceable; UI/export distinguish observed demand from scenarios; unresolved cases cannot return binary demand suitability or authoritative demand-optimized C.

'''
          anchor = '## Stage 4 — OR-Tools feasibility solver\n'
          if '## Stage 3A — Structural-change demand boundary' not in text:
              if anchor not in text:
                  raise SystemExit('Migration Stage 4 anchor not found')
              text = text.replace(anchor, stage + anchor, 1)
          text = replace_once(
              text,
              'Add Level 1 block allocation and lexicographic no-service/90%/85% overload stages. Keep static demand limitations explicit.',
              'Add Level 1 block allocation and lexicographic no-service/90%/85% overload stages. Keep static demand limitations explicit. Structural-change cases require completed Stage 3A scenario/calibration support and MUST NOT optimize against coarse A demand as if it were fine-grained B demand.',
              'migration stage 5',
          )
          text = replace_once(
              text,
              '  S0["0 Contract freeze"] --> S1["1 Normalize"] --> S2["2 Evaluate"] --> S3["3 Solver interface"]\n  S3 --> S4["4 Feasibility"] --> S5["5 Demand allocation"] --> S6["6 Regularity"]\n  S6 --> S7["7 Parallel validation"] --> S8["8 Cutover"]',
              '  S0["0 Contract freeze"] --> S1["1 Normalize"] --> S2["2 Evaluate"] --> S3["3 Solver interface"]\n  S3 --> S3A["3A Structural-change demand boundary"]\n  S3 --> S4["4 Feasibility"]\n  S3A --> S5["5 Demand allocation"]\n  S4 --> S5 --> S6["6 Regularity"]\n  S6 --> S7["7 Parallel validation"] --> S8["8 Cutover"]',
              'migration dependency diagram',
          )
          text = replace_once(
              text,
              '6. Benchmark event-balance/reservoir and connection-graph fleet formulations on tiny and 40–80 trip cases.\n7. Implement CP-SAT feasibility, then demand allocation, then regularity.\n8. Complete visualization/export cutover only after solution reconciliation is stable.',
              '6. Implement V1-A1 service-change classification, scenario workflow, and `1.1.0` contracts.\n7. Benchmark event-balance/reservoir and connection-graph fleet formulations on tiny and 40–80 trip cases.\n8. Implement CP-SAT hard feasibility in parallel with V1-A1; add demand allocation only after both gates pass.\n9. Complete visualization/export cutover only after solution and scenario reconciliation are stable.',
              'migration backlog',
          )
          write(name, text)

          name = 'CURRENT_STATE_GAP_ANALYSIS.md'
          text = read(name)
          text = replace_once(
              text,
              'Audit date: 2026-07-22. The target rules are in [Engine Contract V1](ENGINE_CONTRACT_V1.md). This report describes the inspected workspace without changing runtime code.',
              'Audit date: 2026-07-22. The target rules are in [Engine Contract V1](ENGINE_CONTRACT_V1.md), including [Amendment V1-A1](EXTREME_SERVICE_CHANGE_AND_DEMAND_SCENARIO_AMENDMENT_V1.md). This report describes the inspected workspace without changing runtime code.',
              'gap analysis normative source',
          )
          text = append_once(text, '## V1-A1 implementation gap', '''## V1-A1 implementation gap

Runtime `1.0.0` does not yet derive total/directional/local service-change metrics, classify structural changes, evaluate temporal/frequency/response support, run a scenario-selection workflow, return unresolved-demand statuses, or export scenario/monitoring records. It may therefore overstate demand suitability when A demand is coarse and B service changes substantially.

This is a documented migration gap, not permission to infer fine-grained or induced demand. The next contract implementation PR must add `1.1.0` schemas/models/validators before OR-Tools demand allocation is considered conforming. Hard technical feasibility work remains separable and may continue.''')
          write(name, text)
          PY

      - name: Validate repository
        run: |
          python -m pip install -e '.[dev]'
          python -m pytest
          python -m ruff check . --exclude .artifact --exclude outputs --exclude .venv
          python -m ruff format --check src/bus_schedule_engine/contracts_v1 tests/test_contract*.py

      - name: Upload amended documents
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v1-a1-amended-documents
          path: docs/engine

      - name: Commit amendment on push
        if: github.event_name == 'push'
        run: |
          rm .github/workflows/apply-v1-a1-doc-amendment.yml
          rm -f .v1-a1-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/engine .github/workflows/apply-v1-a1-doc-amendment.yml .v1-a1-trigger
          git commit -m 'Amend Contract V1 for structural service changes'
          git push origin HEAD:docs/extreme-service-change-demand-scenarios-v1
