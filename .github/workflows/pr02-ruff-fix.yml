name: Fix and validate PR-02

on:
  push:
    branches:
      - feat/authoritative-demand-evaluator-v1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/authoritative-demand-evaluator-v1
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Apply Ruff fixes
        run: |
          python -m ruff check --fix \
            src/bus_schedule_engine/contracts_v1 \
            tests/test_contract_v1_evaluation.py
          python -m ruff format \
            src/bus_schedule_engine/contracts_v1 \
            tests/test_contract_v1_evaluation.py

      - name: Tests
        run: python -m pytest

      - name: Ruff lint
        run: python -m ruff check . --exclude .artifact --exclude outputs --exclude .venv

      - name: Ruff format
        run: |
          python -m ruff format --check \
            src/bus_schedule_engine/contracts_v1 \
            tests/test_contract*.py

      - name: Commit clean result
        run: |
          rm .github/workflows/pr02-ruff-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/bus_schedule_engine/contracts_v1 \
            tests/test_contract_v1_evaluation.py \
            .github/workflows/pr02-ruff-fix.yml
          git commit -m 'Clean PR-02 demand evaluator implementation'
          git push origin HEAD:feat/authoritative-demand-evaluator-v1
