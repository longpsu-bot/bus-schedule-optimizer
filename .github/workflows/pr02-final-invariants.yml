name: Finalize PR-02 invariants

on:
  push:
    branches:
      - feat/authoritative-demand-evaluator-v1

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/authoritative-demand-evaluator-v1
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Add final evaluator invariants
        run: |
          python - <<'PY'
          from pathlib import Path

          resolution_path = Path(
              'src/bus_schedule_engine/contracts_v1/demand_resolution.py'
          )
          resolution = resolution_path.read_text(encoding='utf-8')
          anchor = '\ndef detect_demand_resolution_v1(\n'
          helper = '''

def _validate_source_observations(
    demand: ObservedDemandInput,
    policy: DemandBlockPolicyV1,
) -> None:
    source_types = {
        item.source_resolution_type for item in demand.observations
    }
    if len(source_types) > 1:
        raise DemandResolutionError(
            "Mixed source resolutions require conservative pre-normalization "
            "into a separately identified comparison dataset"
        )
    if policy.interpolation_method != InterpolationMethod.NONE:
        raise DemandResolutionError(
            "PR-02 authoritative implementation supports interpolation_method=none only"
        )
    if source_types == {DemandResolutionType.REGULAR_INTERVAL}:
        resolution_values = {
            item.source_resolution_minutes for item in demand.observations
        }
        if None in resolution_values or len(resolution_values) != 1:
            raise DemandResolutionError(
                "Regular-interval demand requires one explicit common source resolution"
            )

    by_direction: dict[ContractDirection, list[DemandObservation]] = {}
    for observation in demand.observations:
        if observation.source_resolution_type == DemandResolutionType.DAILY_TOTAL:
            continue
        by_direction.setdefault(observation.direction, []).append(observation)
    for direction, observations in by_direction.items():
        ordered = sorted(
            observations,
            key=lambda item: (
                item.interval_start,
                item.interval_end,
                item.observation_id,
            ),
        )
        for previous, current in zip(ordered, ordered[1:], strict=False):
            if current.interval_start < previous.interval_end:
                raise DemandResolutionError(
                    "Overlapping demand observations are not authoritative within "
                    f"direction {direction.value}: {previous.observation_id}, "
                    f"{current.observation_id}"
                )
'''
          if helper.strip() not in resolution:
              if anchor not in resolution:
                  raise SystemExit('Resolution detector anchor not found')
              resolution = resolution.replace(anchor, helper + anchor, 1)

          old = '''    if policy.smoothing_method != SmoothingMethod.NONE:
              raise DemandResolutionError(
                  "PR-02 authoritative implementation supports smoothing_method=none only"
              )

              source_type = _source_resolution_type(demand)
          '''.replace('          ', '')
          new = '''    if policy.smoothing_method != SmoothingMethod.NONE:
              raise DemandResolutionError(
                  "PR-02 authoritative implementation supports smoothing_method=none only"
              )
              _validate_source_observations(demand, policy)

              source_type = _source_resolution_type(demand)
          '''.replace('          ', '')
          if old not in resolution:
              raise SystemExit('Resolution validation insertion point not found')
          resolution_path.write_text(
              resolution.replace(old, new, 1),
              encoding='utf-8',
          )

          evaluation_path = Path(
              'src/bus_schedule_engine/contracts_v1/evaluation.py'
          )
          evaluation = evaluation_path.read_text(encoding='utf-8')
          old = '''    if BlockSupplyStatus.INSUFFICIENT_DATA in statuses:
              status = DimensionStatus.INSUFFICIENT_DATA
          elif any(item.severity == EvaluationIssueSeverity.ERROR for item in issues):
              status = DimensionStatus.FAIL
          elif issues:
              status = DimensionStatus.WARNING
          else:
              status = DimensionStatus.PASS
          '''.replace('          ', '')
          new = '''    if any(
              item.severity == EvaluationIssueSeverity.ERROR for item in issues
          ):
              status = DimensionStatus.FAIL
          elif BlockSupplyStatus.INSUFFICIENT_DATA in statuses:
              status = DimensionStatus.INSUFFICIENT_DATA
          elif issues:
              status = DimensionStatus.WARNING
          else:
              status = DimensionStatus.PASS
          '''.replace('          ', '')
          if old not in evaluation:
              raise SystemExit('Demand dimension precedence block not found')
          evaluation_path.write_text(
              evaluation.replace(old, new, 1),
              encoding='utf-8',
          )

          test_path = Path('tests/test_contract_v1_evaluation.py')
          tests = test_path.read_text(encoding='utf-8')
          tests = tests.replace(
              '    DemandResolutionError,\n',
              '    DemandResolutionError,\n    InterpolationMethod,\n',
              1,
          )
          additions = '''


def test_overlapping_same_direction_demand_is_rejected(
    make_parameters,
    make_valid_trips,
) -> None:
    parameters = make_parameters()
    bundle = _bundle(
        parameters,
        make_valid_trips(parameters),
        [
            _record(
                6,
                8,
                40,
                direction=Direction.TERMINAL_1_TO_2,
            ),
            _record(
                7,
                9,
                40,
                direction=Direction.TERMINAL_1_TO_2,
            ),
        ],
    )

    with pytest.raises(DemandResolutionError, match="Overlapping demand observations"):
        build_demand_analysis_blocks_v1(bundle.observed_demand)


def test_unimplemented_interpolation_policy_is_rejected(
    make_parameters,
    make_valid_trips,
) -> None:
    parameters = make_parameters()
    bundle = _bundle(
        parameters,
        make_valid_trips(parameters),
        [_record(6, 7, 20)],
    )

    with pytest.raises(DemandResolutionError, match="interpolation_method=none"):
        build_demand_analysis_blocks_v1(
            bundle.observed_demand,
            DemandBlockPolicyV1(
                interpolation_method=InterpolationMethod.STEP,
            ),
        )


def test_no_service_failure_is_not_erased_by_insufficient_blocks(
    make_parameters,
    make_valid_trips,
) -> None:
    parameters = make_parameters(vehicle_capacity_passengers=100)
    bundle = _bundle(
        parameters,
        make_valid_trips(parameters),
        [_record(5, 6, 50), _record(6, 7, 50)],
        confidence=DemandConfidence.LOW,
    )

    result = evaluate_scenario_b_v1(bundle)

    assert result.b_block_supply[0].status == BlockSupplyStatus.NO_SERVICE_WITH_DEMAND
    assert result.b_block_supply[1].status == BlockSupplyStatus.INSUFFICIENT_DATA
    assert result.evaluation.demand_suitability.status == DimensionStatus.FAIL
'''
          if 'test_overlapping_same_direction_demand_is_rejected' not in tests:
              tests += additions
          test_path.write_text(tests, encoding='utf-8')
          PY

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Ruff fix and format
        run: |
          python -m ruff check --fix \
            src/bus_schedule_engine/contracts_v1 \
            tests/test_contract_v1_evaluation.py
          python -m ruff format \
            src/bus_schedule_engine/contracts_v1 \
            tests/test_contract_v1_evaluation.py

      - name: Tests
        run: python -m pytest

      - name: Ruff lint
        run: python -m ruff check . --exclude .artifact --exclude outputs --exclude .venv

      - name: Ruff format
        run: |
          python -m ruff format --check \
            src/bus_schedule_engine/contracts_v1 \
            tests/test_contract*.py

      - name: Commit clean result
        run: |
          rm .github/workflows/pr02-final-invariants.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/bus_schedule_engine/contracts_v1 \
            tests/test_contract_v1_evaluation.py \
            .github/workflows/pr02-final-invariants.yml
          git commit -m 'Enforce final PR-02 demand evaluation invariants'
          git push origin HEAD:feat/authoritative-demand-evaluator-v1
