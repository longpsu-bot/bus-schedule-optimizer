name: Validate final PR-01 fleet invariant

on:
  push:
    branches:
      - feat/normalized-domain-inputs-v1
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/normalized-domain-inputs-v1
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Add positive approved fleet invariant
        run: |
          python - <<'PY'
          from pathlib import Path

          validation_path = Path('src/bus_schedule_engine/contracts_v1/validation.py')
          lines = validation_path.read_text(encoding='utf-8').splitlines()
          start = next(
              index
              for index, line in enumerate(lines)
              if line == '    if ('
              and index + 1 < len(lines)
              and 'scenario.approved_active_fleet is not None' in lines[index + 1]
          )
          end = next(
              index
              for index in range(start + 1, len(lines))
              if lines[index] == '    first_times = ('
          )
          replacement = [
              '    if scenario.approved_active_fleet is not None:',
              '        if scenario.approved_active_fleet <= 0:',
              '            issues.append(',
              '                _issue(',
              '                    "INVALID_APPROVED_ACTIVE_FLEET",',
              '                    f"{prefix}.approved_active_fleet",',
              '                    "approved_active_fleet must be positive when provided",',
              '                )',
              '            )',
              '        elif scenario.approved_active_fleet > scenario.available_fleet_limit:',
              '            issues.append(',
              '                _issue(',
              '                    "APPROVED_FLEET_EXCEEDS_AVAILABLE_LIMIT",',
              '                    f"{prefix}.approved_active_fleet",',
              '                    "approved_active_fleet must not exceed available_fleet_limit",',
              '                )',
              '            )',
              '',
          ]
          validation_path.write_text(
              '\n'.join(lines[:start] + replacement + lines[end:]) + '\n',
              encoding='utf-8',
          )

          test_path = Path('tests/test_contract_v1_normalization.py')
          test_lines = test_path.read_text(encoding='utf-8').splitlines()
          if not any('INVALID_APPROVED_ACTIVE_FLEET' in line for line in test_lines):
              anchor = next(
                  index
                  for index, line in enumerate(test_lines)
                  if line.strip()
                  == 'assert "APPROVED_FLEET_EXCEEDS_AVAILABLE_LIMIT" in result.error_codes'
              )
              addition = [
                  '',
                  '    zero_fleet = replace(bundle.scenario_b, approved_active_fleet=0)',
                  '    zero_result = validate_scenario_input(zero_fleet)',
                  '    assert "INVALID_APPROVED_ACTIVE_FLEET" in zero_result.error_codes',
              ]
              test_lines[anchor + 1:anchor + 1] = addition
              test_path.write_text('\n'.join(test_lines) + '\n', encoding='utf-8')
          PY

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Format
        run: python -m ruff format src/bus_schedule_engine/contracts_v1/validation.py tests/test_contract_v1_normalization.py

      - name: Test
        run: python -m pytest

      - name: Lint
        run: python -m ruff check . --exclude .artifact --exclude outputs --exclude .venv

      - name: Commit clean result
        run: |
          rm .github/workflows/pr01-validator-final.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/bus_schedule_engine/contracts_v1/validation.py \
            tests/test_contract_v1_normalization.py \
            .github/workflows/pr01-validator-final.yml
          git commit -m 'Enforce positive approved fleet metadata'
          git push origin HEAD:feat/normalized-domain-inputs-v1
