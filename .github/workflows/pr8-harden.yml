name: Harden PR 8 solver boundary

on:
  push:
    branches:
      - feat/solver-interface-heuristic-adapter-v1

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/solver-interface-heuristic-adapter-v1
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Apply boundary hardening
        run: |
          python - <<'PY'
          from pathlib import Path

          validation_path = Path('src/bus_schedule_engine/contracts_v1/solver_validation.py')
          validation = validation_path.read_text(encoding='utf-8')
          validation = validation.replace(
              'from dataclasses import asdict, replace\n',
              'from dataclasses import replace\n',
              1,
          )
          validation = validation.replace(
              'from .serialization import canonical_sha256\n',
              'from .serialization import canonical_sha256\n'
              'from .solver_fingerprints import candidate_fingerprint, solution_fingerprint_payload\n',
              1,
          )
          validation = validation.replace(
              'from .solver_problem import jsonable, legacy_direction\n',
              'from .solver_problem import legacy_direction\n',
              1,
          )
          old = '''
          def _solution_fingerprint_payload(solution: ScheduleSolutionV1) -> dict[str, object]:
              payload = jsonable(asdict(solution))
              payload.pop("solution_fingerprint", None)
              payload.pop("solve_duration_seconds", None)
              return payload


          '''.replace('          ', '')
          validation = validation.replace(old, '', 1)
          anchor = '''    if set(source_ids) != set(expected_source_ids):
              rejection_codes.append("SOURCE_B_MAPPING_NOT_ONE_TO_ONE")
          '''.replace('          ', '')
          addition = anchor + '''    expected_candidate_fingerprint = candidate_fingerprint(
              source_b_fingerprint=problem.normalized_inputs.scenario_b_fingerprint,
              solver_adapter=candidate.solver_adapter,
              exact_timetable=candidate.exact_timetable,
              headway_regimes=candidate.headway_regimes,
          )
          if candidate.candidate_fingerprint != expected_candidate_fingerprint:
              rejection_codes.append("CANDIDATE_FINGERPRINT_MISMATCH")
          '''.replace('          ', '')
          if anchor not in validation:
              raise SystemExit('Candidate mapping anchor not found')
          validation = validation.replace(anchor, addition, 1)
          lock_anchor = '''        "available_fleet_limit": b.available_fleet_limit,
              "operating_day_type": b.operating_day_type.value,
          '''.replace('          ', '')
          lock_replacement = '''        "available_fleet_limit": b.available_fleet_limit,
              "approved_active_fleet": b.approved_active_fleet,
              "fleet_constraint_mode": "available_upper_bound",
              "initial_fleet_positioning_mode": "solver_determined",
              "direction_trip_lock_mode": "fixed_by_direction",
              "operating_day_type": b.operating_day_type.value,
          '''.replace('          ', '')
          if lock_anchor not in validation:
              raise SystemExit('Operating lock anchor not found')
          validation = validation.replace(lock_anchor, lock_replacement, 1)
          validate_anchor = '\ndef validate_and_build_solution_v1(\n'
          helper = '''

          def _maximum_simultaneous_vehicle_use(assignments) -> int:
              events: list[tuple[int, int]] = []
              for assignment in assignments:
                  events.append((assignment.departure_seconds, 1))
                  events.append((assignment.ready_seconds, -1))
              active = 0
              maximum = 0
              for _, delta in sorted(events, key=lambda item: (item[0], item[1])):
                  active += delta
                  maximum = max(maximum, active)
              return maximum
          '''.replace('          ', '')
          if validate_anchor not in validation:
              raise SystemExit('Validation function anchor not found')
          validation = validation.replace(validate_anchor, helper + validate_anchor, 1)
          validation = validation.replace(
              '        maximum_simultaneous_vehicle_use=fleet.minimum_required_fleet,\n',
              '        maximum_simultaneous_vehicle_use=_maximum_simultaneous_vehicle_use(\n'
              '            assignments.assignments\n'
              '        ),\n',
              1,
          )
          validation = validation.replace(
              '        solution_fingerprint=canonical_sha256(_solution_fingerprint_payload(provisional)),\n',
              '        solution_fingerprint=canonical_sha256(solution_fingerprint_payload(provisional)),\n',
              1,
          )
          validation = validation.replace(
              '        limitations=candidate.limitations,\n',
              '        limitations=candidate.limitations\n'
              '        + (\n'
              '            "PR-03 supports available_upper_bound fleet constraints and "\n'
              '            "solver_determined initial positioning only.",\n'
              '        ),\n',
              1,
          )
          validation_path.write_text(validation, encoding='utf-8')

          orchestration_path = Path('src/bus_schedule_engine/contracts_v1/solver_orchestration.py')
          orchestration = orchestration_path.read_text(encoding='utf-8')
          orchestration = orchestration.replace(
              'from dataclasses import asdict, replace\n',
              'from dataclasses import replace\n',
              1,
          )
          orchestration = orchestration.replace(
              'from .serialization import canonical_sha256\n',
              'from .serialization import canonical_sha256\n'
              'from .solver_fingerprints import outcome_fingerprint_payload\n',
              1,
          )
          orchestration = orchestration.replace(
              'from .solver_problem import jsonable\n',
              '',
              1,
          )
          old = '''
          def _outcome_fingerprint_payload(
              outcome: ScheduleGenerationOutcomeV1,
          ) -> dict[str, object]:
              payload = jsonable(asdict(outcome))
              payload.pop("outcome_fingerprint", None)
              payload.pop("solve_duration_seconds", None)
              return payload


          '''.replace('          ', '')
          orchestration = orchestration.replace(old, '', 1)
          orchestration = orchestration.replace(
              '        outcome_fingerprint=canonical_sha256(_outcome_fingerprint_payload(outcome)),\n',
              '        outcome_fingerprint=canonical_sha256(outcome_fingerprint_payload(outcome)),\n',
              1,
          )
          invalid_anchor = '''    if run.execution_status != SolverExecutionStatus.COMPLETED:
              return _not_run_outcome(
                  problem,
                  GenerationResultStatus.C_NOT_GENERATED_MODEL_INVALID,
                  "Solver adapter returned an invalid execution-state combination.",
              )
          '''.replace('          ', '')
          invalid_replacement = '''    if run.execution_status != SolverExecutionStatus.COMPLETED:
              return _completed_without_solution(
                  problem,
                  result_status=GenerationResultStatus.C_NOT_GENERATED_MODEL_INVALID,
                  solver_status=NativeSolverStatus.MODEL_INVALID,
                  solver_adapter=run.solver_adapter,
                  solve_duration_seconds=run.solve_duration_seconds,
                  explanations=(
                      "Solver adapter returned an invalid execution-state combination.",
                  ),
                  limitations=run.limitations,
              )
          '''.replace('          ', '')
          if invalid_anchor not in orchestration:
              raise SystemExit('Invalid execution anchor not found')
          orchestration = orchestration.replace(invalid_anchor, invalid_replacement, 1)
          orchestration = orchestration.replace(
              '    if run.candidate is None or run.candidate.solver_status != run.solver_status:\n',
              '    if (\n'
              '        run.candidate is None\n'
              '        or run.candidate.solver_status != run.solver_status\n'
              '        or run.candidate.solver_adapter != run.solver_adapter\n'
              '    ):\n',
              1,
          )
          orchestration_path.write_text(orchestration, encoding='utf-8')

          tests_path = Path('tests/test_contract_v1_solver.py')
          tests = tests_path.read_text(encoding='utf-8')
          fingerprint_test = '''

          def test_candidate_fingerprint_tampering_is_rejected() -> None:
              problem, *_ = _problem()
              run = HeuristicScheduleSolverAdapter().solve(problem)
              assert run.candidate is not None
              tampered = replace(run.candidate, candidate_fingerprint="0" * 64)

              validation = validate_and_build_solution_v1(problem, tampered)

              assert validation.status == CandidateValidationStatus.REJECTED
              assert "CANDIDATE_FINGERPRINT_MISMATCH" in validation.rejection_codes


          def test_outcome_fingerprint_ignores_solve_duration() -> None:
              problem, *_ = _problem()
              run = HeuristicScheduleSolverAdapter().solve(problem)
              assert run.candidate is not None
              first = run_schedule_solver_v1(problem, _StaticSolver(run))
              delayed_candidate = replace(
                  run.candidate,
                  solve_duration_seconds=run.candidate.solve_duration_seconds + 9,
              )
              delayed_run = replace(
                  run,
                  solve_duration_seconds=run.solve_duration_seconds + 9,
                  candidate=delayed_candidate,
              )
              second = run_schedule_solver_v1(problem, _StaticSolver(delayed_run))

              assert first.outcome_fingerprint == second.outcome_fingerprint
              assert first.solution is not None
              assert second.solution is not None
              assert first.solution.solution_fingerprint == second.solution.solution_fingerprint


          def test_invalid_execution_state_is_completed_model_invalid_not_not_run() -> None:
              problem, *_ = _problem()
              invalid_run = SolverRunResultV1(
                  execution_status=SolverExecutionStatus.NOT_RUN,
                  solver_status=NativeSolverStatus.FEASIBLE,
                  solver_adapter="invalid_test_adapter",
                  solve_duration_seconds=0.1,
                  candidate=None,
                  explanations=("invalid",),
                  limitations=(),
              )

              outcome = run_schedule_solver_v1(problem, _StaticSolver(invalid_run))

              assert outcome.execution_status == SolverExecutionStatus.COMPLETED
              assert outcome.solver_status == NativeSolverStatus.MODEL_INVALID
              assert outcome.result_status == GenerationResultStatus.C_NOT_GENERATED_MODEL_INVALID


          def test_solution_reports_modes_locks_and_actual_maximum_vehicle_use() -> None:
              problem, *_ = _problem()
              outcome = run_schedule_solver_v1(problem, HeuristicScheduleSolverAdapter())
              assert outcome.solution is not None
              solution = outcome.solution
              lock_fields = {lock.field for lock in solution.operating_parameter_locks}
              assert {
                  "fleet_constraint_mode",
                  "initial_fleet_positioning_mode",
                  "direction_trip_lock_mode",
              } <= lock_fields
              events = []
              for assignment in solution.fleet_assignment:
                  events.append((assignment.departure_time, 1))
                  events.append((assignment.ready_time, -1))
              active = 0
              maximum = 0
              for _, delta in sorted(events, key=lambda item: (item[0], item[1])):
                  active += delta
                  maximum = max(maximum, active)
              assert solution.maximum_simultaneous_vehicle_use == maximum
              assert maximum <= solution.minimum_required_fleet
          '''.replace('          ', '')
          if 'test_candidate_fingerprint_tampering_is_rejected' not in tests:
              tests += fingerprint_test
          tests_path.write_text(tests, encoding='utf-8')
          PY

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Ruff fix and format
        run: |
          python -m ruff check --fix \
            src/bus_schedule_engine/contracts_v1/solver_fingerprints.py \
            src/bus_schedule_engine/contracts_v1/heuristic_solver.py \
            src/bus_schedule_engine/contracts_v1/solver_validation.py \
            src/bus_schedule_engine/contracts_v1/solver_orchestration.py \
            tests/test_contract_v1_solver.py
          python -m ruff format \
            src/bus_schedule_engine/contracts_v1/solver_fingerprints.py \
            src/bus_schedule_engine/contracts_v1/heuristic_solver.py \
            src/bus_schedule_engine/contracts_v1/solver_validation.py \
            src/bus_schedule_engine/contracts_v1/solver_orchestration.py \
            tests/test_contract_v1_solver.py

      - name: Validate
        run: |
          python -m pytest
          python -m ruff check . --exclude .artifact --exclude outputs --exclude .venv
          python -m ruff format --check \
            src/bus_schedule_engine/contracts_v1 \
            tests/test_contract*.py

      - name: Commit clean result
        run: |
          rm .github/workflows/pr8-harden.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/bus_schedule_engine/contracts_v1 \
            tests/test_contract_v1_solver.py \
            .github/workflows/pr8-harden.yml
          git commit -m 'Harden solver fingerprints and outcome semantics'
          git push origin HEAD:feat/solver-interface-heuristic-adapter-v1
