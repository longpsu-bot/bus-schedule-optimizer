name: Apply and validate PR-02

on:
  push:
    branches:
      - feat/authoritative-demand-evaluator-v1
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/authoritative-demand-evaluator-v1
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Apply evaluator integration fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/bus_schedule_engine/contracts_v1/evaluation.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('from dataclasses import dataclass\n', 'from dataclasses import dataclass, replace\n', 1)
          text = text.replace('    BlockMode,\n', '    BlockBoundaryReason,\n    BlockMode,\n', 1)
          text = text.replace('ScenarioEvaluationError', 'ScenarioBEvaluationError')

          old = '''    if interpolation_status == InterpolationStatus.UNSUPPORTED:
              return BlockSupplyStatus.INSUFFICIENT_DATA
          if not _confidence_at_least(
              confidence, policy.minimum_authoritative_demand_confidence
          ):
              return BlockSupplyStatus.INSUFFICIENT_DATA
          if demand > 0 and trip_count == 0:
              return BlockSupplyStatus.NO_SERVICE_WITH_DEMAND
          '''.replace('          ', '')
          new = '''    if interpolation_status == InterpolationStatus.UNSUPPORTED:
              return BlockSupplyStatus.INSUFFICIENT_DATA
          if demand > 0 and trip_count == 0:
              return BlockSupplyStatus.NO_SERVICE_WITH_DEMAND
          if not _confidence_at_least(
              confidence, policy.minimum_authoritative_demand_confidence
          ):
              return BlockSupplyStatus.INSUFFICIENT_DATA
          '''.replace('          ', '')
          if old not in text:
              raise SystemExit('block status ordering anchor not found')
          text = text.replace(old, new, 1)

          anchor = '\ndef _demand_dimension(\n'
          helper = '''

def _protect_adaptive_critical_conditions(
    bundle: NormalizedInputBundleV1,
    resolution: DemandResolutionResultV1,
    policy: ScenarioBEvaluationPolicyV1,
) -> DemandResolutionResultV1:
    if (
        policy.demand_blocks.block_mode != BlockMode.ADAPTIVE
        or bundle.observed_demand is None
        or not resolution.blocks
    ):
        return resolution
    native_policy = replace(
        policy.demand_blocks,
        block_mode=BlockMode.NATIVE,
        manual_boundaries=(),
    )
    native_resolution = build_demand_analysis_blocks_v1(
        bundle.observed_demand,
        native_policy,
    )
    _, native_b_supply = build_block_supply_plans_v1(
        bundle,
        native_resolution,
        policy,
    )
    protected_source_ids: set[str] = set()
    native_by_source: dict[str, DemandAnalysisBlockV1] = {}
    for block, plan in zip(native_resolution.blocks, native_b_supply, strict=True):
        for source_id in block.source_interval_ids:
            native_by_source[source_id] = block
        if plan.status in {
            BlockSupplyStatus.NO_SERVICE_WITH_DEMAND,
            BlockSupplyStatus.CRITICAL_ABOVE_90,
        }:
            protected_source_ids.update(block.source_interval_ids)
    if not protected_source_ids:
        return resolution

    expanded: list[DemandAnalysisBlockV1] = []
    split_applied = False
    for block in resolution.blocks:
        if (
            len(block.source_interval_ids) > 1
            and protected_source_ids.intersection(block.source_interval_ids)
        ):
            split_applied = True
            for source_id in block.source_interval_ids:
                native = native_by_source[source_id]
                expanded.append(
                    replace(
                        native,
                        block_mode=BlockMode.ADAPTIVE,
                        block_boundary_reason=(
                            BlockBoundaryReason.CRITICAL_CONDITION_PROTECTION
                        ),
                    )
                )
        else:
            expanded.append(block)
    if not split_applied:
        return resolution

    counters: dict[ContractDirection, int] = {}
    renumbered: list[DemandAnalysisBlockV1] = []
    for block in sorted(
        expanded,
        key=lambda item: (item.direction.value, item.start_time, item.end_time),
    ):
        counters[block.direction] = counters.get(block.direction, 0) + 1
        renumbered.append(
            replace(
                block,
                block_id=(
                    f"DB-{block.direction.value.upper()}-"
                    f"{counters[block.direction]:04d}"
                ),
            )
        )
    return DemandResolutionResultV1(
        contract=resolution.contract,
        blocks=tuple(renumbered),
        warnings=resolution.warnings
        + (
            "Adaptive merging was split to preserve native critical/no-service evidence.",
        ),
        limitations=resolution.limitations,
    )
'''
          if anchor not in text:
              raise SystemExit('demand dimension anchor not found')
          text = text.replace(anchor, helper + anchor, 1)

          old = '''        resolution = build_demand_analysis_blocks_v1(
              bundle.observed_demand,
              policy.demand_blocks,
          )
          a_supply, b_supply = build_block_supply_plans_v1(bundle, resolution, policy)
          '''.replace('          ', '')
          new = '''        resolution = build_demand_analysis_blocks_v1(
              bundle.observed_demand,
              policy.demand_blocks,
          )
          resolution = _protect_adaptive_critical_conditions(
              bundle,
              resolution,
              policy,
          )
          a_supply, b_supply = build_block_supply_plans_v1(bundle, resolution, policy)
          '''.replace('          ', '')
          if old not in text:
              raise SystemExit('evaluation resolution anchor not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Format changed Python
        run: |
          python -m ruff format \
            src/bus_schedule_engine/contracts_v1/demand_resolution.py \
            src/bus_schedule_engine/contracts_v1/evaluation.py \
            src/bus_schedule_engine/contracts_v1/evaluation_serialization.py \
            src/bus_schedule_engine/contracts_v1/__init__.py \
            tests/test_contract_v1_evaluation.py

      - name: Test
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          python -m pytest 2>&1 | tee pr02-test.log

      - name: Lint
        id: lint
        continue-on-error: true
        run: |
          set -o pipefail
          python -m ruff check . --exclude .artifact --exclude outputs --exclude .venv 2>&1 | tee pr02-lint.log

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr02-validation-logs
          path: |
            pr02-test.log
            pr02-lint.log

      - name: Fail after log upload
        if: steps.tests.outcome == 'failure' || steps.lint.outcome == 'failure'
        run: exit 1

      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/pr02-apply.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/bus_schedule_engine/contracts_v1 \
            tests/test_contract_v1_evaluation.py \
            .github/workflows/pr02-apply.yml
          git commit -m 'Implement authoritative demand resolution and B evaluation'
          git push origin HEAD:feat/authoritative-demand-evaluator-v1
