name: One-shot V2 regression migration

on:
  push:
    branches:
      - fix/scenario-c-balanced-regime-policy-v2
    paths:
      - tools/_migrate_v2_regression_expectations.py
      - .github/workflows/_migrate_v2_regression_expectations.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/scenario-c-balanced-regime-policy-v2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply deterministic V2 regression migration
        run: python tools/_migrate_v2_regression_expectations.py
      - name: Commit migrated expectations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Migrate regression expectations to balanced regime V2"
          git push origin HEAD:fix/scenario-c-balanced-regime-policy-v2
