name: Temporary PR45 migration helper

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  migrate-pr45:
    if: >-
      github.event.pull_request.number == 45 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR45 head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Apply V2 regression migration
        run: |
          set -o pipefail
          python tools/pr45_migrate_v2.py 2>&1 | tee pr45-helper-edit.log

      - name: Ruff fix and format
        run: |
          set -o pipefail
          python -m ruff check . --fix \
            --exclude .artifact \
            --exclude outputs \
            --exclude .venv 2>&1 | tee pr45-helper-ruff.log
          python -m ruff format \
            src/bus_schedule_engine/contracts_v1 \
            tests/test_contract*.py \
            tests/test_optimization_service.py \
            tests/test_protected_service_floor_heuristic_search.py \
            tests/test_protected_service_floor_ortools_constraints.py \
            tools/pr45_migrate_v2.py 2>&1 | tee -a pr45-helper-ruff.log

      - name: Full pytest
        run: |
          set -o pipefail
          python -m pytest 2>&1 | tee pr45-helper-pytest.log

      - name: Diff check
        run: git diff --check

      - name: Commit and push migration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src tests tools/pr45_migrate_v2.py
          if git diff --cached --quiet; then
            echo 'No migration changes to commit.'
            exit 0
          fi
          git commit -m 'Migrate balanced-regime regressions to V2 semantics'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Report helper failure on PR45
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### Temporary PR45 migration helper failure'
            echo
            echo '```text'
            for file in pr45-helper-edit.log pr45-helper-ruff.log pr45-helper-pytest.log; do
              if [ -f "$file" ]; then
                echo "--- $file ---"
                tail -n 160 "$file"
              fi
            done
            echo '```'
          } > pr45-helper-comment.md
          gh pr comment 45 --body-file pr45-helper-comment.md

      - name: Upload helper logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr45-migration-helper-logs
          path: |
            pr45-helper-edit.log
            pr45-helper-ruff.log
            pr45-helper-pytest.log
          if-no-files-found: ignore
