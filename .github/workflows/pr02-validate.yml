name: Validate PR-02 demand evaluator

on:
  push:
    branches:
      - feat/pr02-demand-resolution-evaluator
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pr02-demand-resolution-evaluator
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - name: Format changed Python
        run: python -m ruff format src/bus_schedule_engine/evaluation_v1 tests/test_evaluation_v1.py
      - name: Test
        run: python -m pytest
      - name: Lint
        run: python -m ruff check . --exclude .artifact --exclude outputs --exclude .venv
      - name: Commit validated result
        run: |
          rm .github/workflows/pr02-validate.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/bus_schedule_engine/evaluation_v1 tests/test_evaluation_v1.py .github/workflows/pr02-validate.yml
          git commit -m 'Implement authoritative demand resolution and B evaluation'
          git push origin HEAD:feat/pr02-demand-resolution-evaluator
